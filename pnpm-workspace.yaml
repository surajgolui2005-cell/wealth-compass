packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
  - "@expo/cli@57.0.26"
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24
  - expo-notifications@57.0.20
