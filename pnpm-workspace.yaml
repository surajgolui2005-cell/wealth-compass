packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
