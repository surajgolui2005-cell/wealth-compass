services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: investor_pm_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-investor_pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-investor_pm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - investor_pm_network

  redis:
    image: redis:7-alpine
    container_name: investor_pm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - investor_pm_network

  adminer:
    image: adminer:latest
    container_name: investor_pm_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investor_pm_network

volumes:
  pgdata:
    name: investor_pm_pgdata
  redisdata:
    name: investor_pm_redisdata

networks:
  investor_pm_network:
    name: investor_pm_network
    driver: bridge
