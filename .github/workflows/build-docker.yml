name: Build & Security Scan Container Images

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".dockerignore"
      - ".github/workflows/build-docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".dockerignore"
      - ".github/workflows/build-docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Matrix Build, Layer Caching & Trivy Scanning ─────────────────────────────
  build-and-scan:
    name: Build & Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
            image_name: wealthcompass-api
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
            image_name: wealthcompass-web
          - service: analytics
            dockerfile: apps/quant-engine/Dockerfile
            context: .
            image_name: wealthcompass-analytics

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Build Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: Build Container Image (with GHA Layer Cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: |
            ${{ matrix.image_name }}:${{ github.sha }}
            ${{ matrix.image_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ matrix.image_name }}:${{ github.sha }}
          scan-type: "image"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "HIGH,CRITICAL"

      - name: Generate Trivy SARIF Report for GitHub Security Tab
        uses: aquasecurity/trivy-action@0.29.0
        if: always()
        with:
          image-ref: ${{ matrix.image_name }}:${{ github.sha }}
          scan-type: "image"
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Security Findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ matrix.image_name }}"

          docker tag "${{ matrix.image_name }}:${{ github.sha }}" "${TARGET_IMAGE}:${{ github.sha }}"
          docker tag "${{ matrix.image_name }}:latest" "${TARGET_IMAGE}:latest"

          docker push "${TARGET_IMAGE}:${{ github.sha }}"
          docker push "${TARGET_IMAGE}:latest"
          echo "Successfully published container image: ${TARGET_IMAGE}:${{ github.sha }}"

  # ── Container Build & Security Gate ─────────────────────────────────────────
  docker-gate:
    name: Docker & Security Gatekeeper
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: always()
    steps:
      - name: Verify All Container Builds & Scans Succeeded
        run: |
          if [ "${{ needs.build-and-scan.result }}" != "success" ]; then
            echo "::error::One or more container builds failed or detected HIGH/CRITICAL vulnerabilities. Deployment is BLOCKED."
            exit 1
          fi
          echo "All container images built, layer-cached, and passed Trivy security gates without High/Critical CVEs."
