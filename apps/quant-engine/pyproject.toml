[project]
name = "quant-engine"
version = "1.0.0"
description = "Internal quantitative risk engine for IPMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Add the quant-engine root to sys.path so `from src.analytics.X` imports resolve correctly.
pythonpath = ["."]
